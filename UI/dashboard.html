<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Media MCP</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background: #f3f4f6;
        color: #172033;
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(100%, 640px);
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      .intro {
        margin-top: 0;
        color: #64748b;
      }

      .connection {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 20px;
        padding: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 24px rgb(15 23 42 / 5%);
      }

      h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 9px;
        background: #334155;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1e293b;
      }

      @media (max-width: 420px) {
        .connection {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Social Media MCP</h1>
      <p class="intro">Connect your social accounts to get started.</p>

      <section class="connection">
        <h2>YouTube</h2>
        <button type="button" onclick="window.location.href='/auth/youtube'">
          Connect YouTube
        </button>
      </section>

      <section class="connection">
        <h2>Instagram</h2>
        <button type="button" onclick="window.location.href='/auth/instagram'">
          Connect Instagram
        </button>
      </section>
    </main>
  </body>
</html>
